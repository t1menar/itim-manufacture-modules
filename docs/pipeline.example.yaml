# DRAFT pipeline `video`: idea -> scenario -> review(script) -> video -> review(post) -> publish.
# Validated against the vendored contract schemas (structure only). The CEL expressions are written for contract
# 0.2.1 semantics and have NOT run on a real core yet (the SDK has no CEL; fakecore refuses input projections,
# routes and `when`). Revision rounds use `routes` with `max_visits`; the round number travels in the data because the
# contract has no visit counter (requirement R2). Waiting is a long step with heartbeats (requirement R1).
apiVersion: manufacture.dev/v1
kind: Module
metadata: {name: idea, labels: {project: itim}}
spec: {image: registry.example/mf-idea:0.1.0, replicas: 1}
---
apiVersion: manufacture.dev/v1
kind: Module
metadata: {name: scenario, labels: {project: itim}}
spec: {image: registry.example/mf-scenario:0.1.0, replicas: 2}
---
apiVersion: manufacture.dev/v1
kind: Module
metadata: {name: video-generation, labels: {project: itim}}
spec: {image: registry.example/mf-video-generation:0.1.0, replicas: 1}
---
apiVersion: manufacture.dev/v1
kind: Module
metadata: {name: telegram-review, labels: {project: itim}}
spec: {image: registry.example/mf-telegram-review:0.1.0, replicas: 1}
---
apiVersion: manufacture.dev/v1
kind: Module
metadata: {name: instagram-publisher, labels: {project: itim}}
spec: {image: registry.example/mf-instagram-publisher:0.1.0, replicas: 1}
---
apiVersion: manufacture.dev/v1
kind: Pipeline
metadata: {name: video, labels: {project: itim}}
spec:
  trigger: {source: idea}
  concurrency: {max_runs: 3}
  defaults: {timeout: 30m, retry: {max_attempts: 2}}
  context:
    schema:
      type: object
      properties:
        idea: {type: object}
      required: [idea]
  stages:
    - name: started
      step:
        id: started
        module: idea
        merge: none
        input: {idea_ref: "data.idea.idea_ref", status: "'running'"}

    - name: scenario
      step:
        id: scenario
        module: scenario
        timeout: 20m
        input:
          idea: "data.idea"
          revision: >-
            has(steps['review-script']) && steps['review-script'].output.outcome == 'rejected'
            ? {'round': steps['review-script'].output.round, 'comment': steps['review-script'].output.comment,
               'previous_script': data.script, 'previous_post': data.post}
            : (has(steps['review-post']) && steps['review-post'].output.outcome == 'rejected'
               ? {'round': steps['review-post'].output.round, 'comment': steps['review-post'].output.comment,
                  'previous_script': data.script, 'previous_post': data.post}
               : null)

    - name: review-script
      step:
        id: review-script
        module: telegram-review
        timeout: 72h
        lease: 2m
        retry: {max_attempts: 1}
        merge: none
        config: {gate: script}
        input:
          idea_ref: "data.idea.idea_ref"
          round: "has(steps['review-script']) ? steps['review-script'].output.round : 0"
          scenario: "{'script': data.script, 'post': data.post}"
          cost_usd: "double(data.cost_usd)"
      routes:
        - {when: "steps['review-script'].output.outcome == 'rejected'", goto: scenario, max_visits: 3}

    - name: video
      step:
        id: video
        module: video-generation
        timeout: 45m
        retry: {max_attempts: 1}
        input:
          idea: "data.idea"
          scenario: "{'research': data.research, 'script': data.script, 'post': data.post}"
          previous: "has(steps.video) ? {'round': 1, 'plan': steps.video.output.capture.plan, 'capture': steps.video.output.capture.document} : null"

    - name: review-post
      step:
        id: review-post
        module: telegram-review
        timeout: 72h
        lease: 2m
        retry: {max_attempts: 1}
        merge: none
        config: {gate: post}
        input:
          idea_ref: "data.idea.idea_ref"
          round: "has(steps['review-post']) ? steps['review-post'].output.round : 0"
          variant: "data.variants[0]"
          account: "data.idea.account"
          cost_usd: "double(data.cost_usd)"
      routes:
        - {when: "steps['review-post'].output.outcome == 'rejected'", goto: scenario, max_visits: 3}

    - name: publish
      step:
        id: publish
        module: instagram-publisher
        timeout: 20m
        retry: {max_attempts: 3, on_errors: [transient]}
        input:
          idea_ref: "data.idea.idea_ref"
          account: "data.idea.account"
          video: "data.variants[0].video"
          cover: "data.variants[0].cover"
          post: "data.variants[0].post"

    - name: finished
      step:
        id: finished
        module: idea
        merge: none
        input:
          idea_ref: "data.idea.idea_ref"
          status: "'succeeded'"
          cost_usd: "double(data.cost_usd)"
