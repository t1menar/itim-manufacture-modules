[project]
name = "module-video"
version = "0.2.0"
description = "Manufacture stage `video`: idea to finished English video"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "prometheus-client>=0.21",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "aioboto3>=15.5.0",
    "httpx>=0.28.1",
    "jsonschema>=4.23",
    "pillow>=11",
    "numpy>=2",
    "fonttools>=4.50",
    "scipy>=1.13",
    "docker>=7.2.0",
]

[project.optional-dependencies]
# only the agent image needs the SDK; the version is recorded in provenance
agent = ["claude-agent-sdk==0.2.179"]

[project.scripts]
mvideo = "mvideo.cli:main"
mvrender = "mvrender.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "respx>=0.23.1",
    "testcontainers[postgres]>=4.8",
    "moto[server]>=5",
    "hypothesis>=6.170.15",
    "imageio-ffmpeg>=0.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mvideo", "src/mvrender"]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["docker: needs a Docker daemon and the image postgres:17 (skipped when absent)"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Pydantic models use instances as field defaults on purpose: they are copied per
# instance and land in the generated settings_schema as defaults.
# allowed_symbols is fixed by the spec and contains characters such as the multiplication sign.
"src/mvideo/settings_model.py" = ["RUF012", "RUF001"]
# Validator messages are long f-strings; allowed_symbols holds characters fixed by the spec.
"src/mvideo/validate/*.py" = ["E501", "RUF001"]
"src/mvideo/cli.py" = ["E501"]
"src/mvrender/draw/debugger.py" = ["RUF001"]  # the call-stack separator is a typographic arrow
"tests/**" = ["S101", "S104", "S105", "S106", "S107", "S108", "S607"]
"src/mvideo/sources/git_cache.py" = ["S108"]  # tmpfs mount point inside the helper container
"src/mvideo/agents/launcher.py" = ["S108"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/mvrender"]

[[tool.mypy.overrides]]
module = ["fontTools.*", "scipy.*", "imageio_ffmpeg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mvideo.*"]
ignore_errors = false

[tool.importlinter]
root_packages = ["mvideo", "mvrender"]

[[tool.importlinter.contracts]]
name = "renderer stays standalone"
type = "forbidden"
source_modules = ["mvrender"]
forbidden_modules = ["mvideo"]
