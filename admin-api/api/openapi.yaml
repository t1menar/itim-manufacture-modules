openapi: 3.0.3
info:
  title: Manufacture admin-api
  version: 0.3.0
  description: |
    Localhost-only administrative facade (D24). No login.
    Errors are RFC 9457 application/problem+json.
servers:
  - url: http://127.0.0.1:58084
paths:
  /health:
    get:
      summary: Liveness
      responses:
        "200": { description: ok }
  /ready:
    get:
      summary: Readiness (database ping)
      responses:
        "200": { description: ready }
        "503": { description: not ready }
  /api/v1/overview:
    get:
      summary: Counters and module health (core)
      responses:
        "200":
          description: overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
  /api/v1/modules:
    get:
      summary: Registered modules (no tokens)
      responses:
        "200":
          description: list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModuleList" }
  /api/v1/modules/{id}:
    get:
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: module } }
  /api/v1/productions:
    get:
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductionList" }
  /api/v1/productions/{id}:
    get:
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: production with variants, jobs, events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Production" }
  /api/v1/jobs/{id}:
    get:
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
  /api/v1/jobs/{id}/cancel:
    post:
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string } } }
      responses: { "204": { description: cancelled } }
  /api/v1/variants/{id}/retry:
    post:
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: new job id
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string, format: uuid }
  /api/v1/variants/{id}/skip:
    post:
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string } } }
      responses: { "204": { description: skipped } }
  /api/v1/ideas:
    get:
      summary: List ideas (module-video; see docs/VIDEO_ADMIN_ROUTES.md)
      responses: { "200": { description: list }, "503": { description: upstream_unavailable } }
    post:
      responses: { "201": { description: created } }
  /api/v1/ideas/{id}:
    get:
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: idea } }
    patch:
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: updated } }
    delete:
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: deleted } }
  /api/v1/ideas/{id}/ready:
    post:
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: ready } }
  /api/v1/ideas/{id}/queue:
    post:
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: queued } }
  /api/v1/topics:
    get:
      responses: { "200": { description: list } }
    post:
      responses: { "201": { description: created } }
  /api/v1/topics/{id}:
    get:
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: topic } }
    patch:
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: updated } }
    delete:
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: deleted } }
  /api/v1/video/prompts:
    get:
      responses: { "200": { description: list } }
  /api/v1/video/credentials:
    get:
      summary: Metadata only (no values)
      responses: { "200": { description: list } }
  /api/v1/review/runs:
    get:
      responses: { "200": { description: list } }
  /api/v1/review/pending:
    get:
      responses: { "200": { description: pending rejects and cards } }
  /api/v1/review/secrets:
    get:
      summary: Presence/length only
      responses: { "200": { description: list } }
  /api/v1/publish/accounts:
    get:
      summary: Accounts with has_token, never the token
      responses: { "200": { description: list } }
    post:
      summary: Create account; access_token is write-only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel_id, platform]
              properties:
                channel_id: { type: string }
                platform: { type: string }
                handle: { type: string }
                external_id: { type: string }
                enabled: { type: boolean }
                access_token: { type: string }
      responses: { "201": { description: created } }
  /api/v1/publish/accounts/{id}:
    patch:
      summary: Update account fields; access_token is write-only and optional
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel_id: { type: string }
                platform: { type: string }
                handle: { type: string }
                external_id: { type: string }
                enabled: { type: boolean }
                access_token: { type: string }
      responses: { "200": { description: updated } }
  /api/v1/publish/accounts/{id}/token:
    put:
      summary: Write access token only; never returned on read
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access_token]
              properties:
                access_token: { type: string }
      responses: { "204": { description: saved } }
  /api/v1/publish/secrets:
    get:
      summary: Presence/length only
      responses: { "200": { description: list } }
  /api/v1/publish/secrets/{key}:
    put:
      parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string }
      responses: { "204": { description: saved } }
    delete:
      parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: deleted } }
  /api/v1/review/secrets/{key}:
    put:
      parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string }
      responses: { "204": { description: saved } }
    delete:
      parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: deleted } }
  /api/v1/video/credentials/{ref}:
    put:
      summary: Write credential value only; never returned on read
      parameters: [{ name: ref, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, value]
              properties:
                kind: { type: string }
                value: { type: string }
                note: { type: string }
      responses:
        "201": { description: created }
        "204": { description: updated }
    delete:
      parameters: [{ name: ref, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: deleted } }
  /api/v1/publish/intents:
    get:
      responses: { "200": { description: list } }
  /api/v1/publish-intents/{id}/republish:
    post:
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
                base_generation: { type: integer }
                acknowledge_unknown_risk: { type: boolean }
      responses: { "200": { description: accepted } }
  /api/v1/audit:
    get:
      responses: { "200": { description: audit log } }
components:
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        request_id: { type: string }
        upstream: { type: string }
    Module:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        stage_id: { type: string }
        endpoint: { type: string }
        version: { type: string }
        contract: { type: integer }
        enabled: { type: boolean }
        active: { type: boolean }
        health: { type: string, description: "up, down or unknown" }
        token_prefix: { type: string, description: "Prefix only, never the raw token" }
        last_seen_at: { type: string, format: date-time }
        admin_endpoints:
          type: array
          items: { type: string }
        rev: { type: integer }
    Overview:
      type: object
      properties:
        productions:
          type: object
          additionalProperties: { type: integer }
        jobs:
          type: object
          additionalProperties: { type: integer }
        variants:
          type: object
          additionalProperties: { type: integer }
        outbox_pending: { type: integer }
        modules:
          type: array
          items: { $ref: "#/components/schemas/Module" }
    ModuleList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Module" }

    ProductionSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        idea_id: { type: integer }
        idea_ref: { type: string }
        idea_rev: { type: integer }
        run_no: { type: integer }
        pipeline_id: { type: string }
        status: { type: string }
        language: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        rev: { type: integer }
    ProductionList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProductionSummary" }
        next_cursor: { type: string, nullable: true }
    Variant:
      type: object
      properties:
        id: { type: string, format: uuid }
        language: { type: string }
        status: { type: string }
        position: { type: integer }
        channels:
          type: array
          items: { type: string }
        attention: {}
        rev: { type: integer }
    Job:
      type: object
      properties:
        id: { type: string, format: uuid }
        production_id: { type: string, format: uuid }
        variant_id: { type: string, format: uuid }
        stage_id: { type: string }
        module_id: { type: string }
        position: { type: integer }
        attempt: { type: integer }
        status: { type: string }
        mode: { type: string }
        fence: { type: integer }
        cancel_requested: { type: boolean }
        error: {}
        progress: {}
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        rev: { type: integer }
    Event:
      type: object
      properties:
        id: { type: integer }
        variant_id: {}
        job_id: {}
        type: { type: string }
        actor: { type: string }
        payload: {}
        at: { type: string, format: date-time }
    Production:
      allOf:
        - { $ref: "#/components/schemas/ProductionSummary" }
        - type: object
          properties:
            pipeline_snapshot: {}
            variants:
              type: array
              items: { $ref: "#/components/schemas/Variant" }
            jobs:
              type: array
              items: { $ref: "#/components/schemas/Job" }
            events:
              type: array
              items: { $ref: "#/components/schemas/Event" }

