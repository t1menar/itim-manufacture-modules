name: mvrender
on:
  pull_request:
    paths:
      - "packages/mvrender/**"
      - ".github/workflows/mvrender.yml"
  push:
    branches: [main]
    paths:
      - "packages/mvrender/**"
      - ".github/workflows/mvrender.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mvrender
    env:
      MVRENDER_FONTS: ${{ github.workspace }}/packages/mvrender/fonts
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12 --extra render
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy
      - name: pytest
        run: uv run pytest -q
