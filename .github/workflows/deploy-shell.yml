name: deploy-shell
on:
  pull_request:
    paths: ["deploy/**", ".github/workflows/deploy-shell.yml"]
  push:
    branches: [main]
    paths: ["deploy/**", ".github/workflows/deploy-shell.yml"]
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          SHELLCHECK_OPTS: -e SC1091 -e SC2034
        with:
          scandir: deploy
          severity: warning
          ignore_paths: deploy/.logs
