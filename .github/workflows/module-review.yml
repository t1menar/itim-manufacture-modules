name: module-review
on:
  pull_request:
    paths:
      - "video-modules/module-review/**"
      - "packages/mf-storage/**"
      - ".github/workflows/module-review.yml"
  push:
    branches: [main]
    paths:
      - "video-modules/module-review/**"
      - "packages/mf-storage/**"
      - ".github/workflows/module-review.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-modules/module-review
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: review
          POSTGRES_PASSWORD: review
          POSTGRES_DB: review
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U review" --health-interval 2s --health-timeout 5s --health-retries 30
      rabbitmq:
        image: rabbitmq:4-management
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-timeout 10s --health-retries 30
    env:
      REVIEW_TEST_DATABASE_URL: postgresql+asyncpg://review:review@localhost:5432/review
      REVIEW_TEST_AMQP_URL: amqp://guest:guest@localhost:5672/
      REVIEW_DATABASE_URL: postgresql+asyncpg://review:review@localhost:5432/review
      REVIEW_LISTEN_ADDR: 127.0.0.1:8080
      MODULE_CORE_URL: http://127.0.0.1:9
      MODULE_CORE_TOKEN: ci-token
      S3_ENDPOINT: 127.0.0.1:9000
      S3_ACCESS_KEY: manufacture
      S3_SECRET_KEY: manufacture_dev_secret
      S3_BUCKET: manufacture
      S3_SECURE: "0"
      S3_PUBLIC_ENDPOINT: 127.0.0.1:9000
      S3_PUBLIC_SECURE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: start MinIO
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/minio/data" "$RUNNER_TEMP/minio/bin"
          curl -fsSL -o "$RUNNER_TEMP/minio/bin/minio" \
            "https://github.com/minio/minio/releases/download/RELEASE.2025-09-07T16-13-09Z/minio.linux-amd64.RELEASE.2025-09-07T16-13-09Z"
          chmod +x "$RUNNER_TEMP/minio/bin/minio"
          export MINIO_ROOT_USER=manufacture MINIO_ROOT_PASSWORD=manufacture_dev_secret
          "$RUNNER_TEMP/minio/bin/minio" server "$RUNNER_TEMP/minio/data" --address ":9000" --console-address ":9001" \
            >"$RUNNER_TEMP/minio/minio.log" 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          curl -sf http://127.0.0.1:9000/minio/health/live
      - name: sync
        run: uv sync
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: pytest
        run: uv run pytest -q
      - name: docker build
        working-directory: ${{ github.workspace }}
        run: docker build -f video-modules/module-review/Dockerfile -t module-review:ci .
