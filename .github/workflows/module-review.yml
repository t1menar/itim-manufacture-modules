name: module-review
on:
  pull_request:
    paths: ["module-review/**", ".github/workflows/module-review.yml"]
  push:
    branches: [main]
    paths: ["module-review/**", ".github/workflows/module-review.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: module-review
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: review
          POSTGRES_PASSWORD: review
          POSTGRES_DB: review
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U review" --health-interval 2s --health-timeout 5s --health-retries 30
      rabbitmq:
        image: rabbitmq:4-management
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-timeout 10s --health-retries 30
    env:
      REVIEW_TEST_DATABASE_URL: postgresql+asyncpg://review:review@localhost:5432/review
      REVIEW_TEST_AMQP_URL: amqp://guest:guest@localhost:5672/
      REVIEW_DATABASE_URL: postgresql+asyncpg://review:review@localhost:5432/review
      REVIEW_LISTEN_ADDR: 127.0.0.1:8080
      MODULE_CORE_URL: http://127.0.0.1:9
      MODULE_CORE_TOKEN: ci-token
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: sync
        run: uv sync
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: pytest
        run: uv run pytest -q
      - name: docker build
        run: docker build -t module-review:ci .
