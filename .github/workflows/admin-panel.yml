name: admin-panel
on:
  pull_request:
    paths: ["admin-panel/**", "admin-api/api/openapi.yaml", ".github/workflows/admin-panel.yml"]
  push:
    branches: [main]
    paths: ["admin-panel/**", "admin-api/api/openapi.yaml", ".github/workflows/admin-panel.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json
      - run: npm ci
      - run: npm run gen:api
      - name: generated client is in sync
        run: git diff --exit-code -- src/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
