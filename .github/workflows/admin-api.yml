name: admin-api
on:
  pull_request:
    paths: ["admin-api/**", ".github/workflows/admin-api.yml"]
  push:
    branches: [main]
    paths: ["admin-api/**", ".github/workflows/admin-api.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      MF_TEST_DATABASE_URL: postgres://postgres:ci-only-password@localhost:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: admin-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: admin-api/go.mod
          cache-dependency-path: admin-api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: test
        run: go test -race -count=1 -v ./...
      - run: go build ./cmd/admin-api
