name: core
on:
  pull_request:
    paths: ["core/**", ".github/workflows/core.yml"]
  push:
    branches: [main]
    paths: ["core/**", ".github/workflows/core.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      rabbitmq:
        image: rabbitmq:4-management
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-timeout 10s --health-retries 30
    env:
      MF_TEST_DATABASE_URL: postgres://postgres:ci-only-password@localhost:5432/postgres?sslmode=disable
      MF_TEST_AMQP_URL: amqp://guest:guest@localhost:5672/
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: test (race, integration against service containers)
        run: go test -race -count=1 -v ./... 2>&1 | tee test.log; test ${PIPESTATUS[0]} -eq 0
      - name: integration tests must not be skipped in CI
        run: "! grep -q -- '--- SKIP' test.log"
      - run: go build ./cmd/core
