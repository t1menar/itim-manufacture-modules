[project]
name = "module-review"
version = "0.1.0"
description = "Manufacture stage `review`: Telegram review bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "prometheus-client>=0.21",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.28",
    "jsonschema>=4.23",
    "aio-pika>=9.4",
    "psycopg[binary]>=3.2",
    "mf-storage",
]

[project.scripts]
review = "review.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "respx>=0.21",
    "testcontainers[postgres,rabbitmq]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/review"]

[[tool.mypy.overrides]]
module = ["aio_pika.*", "aiormq.*", "pamqp.*", "prometheus_client.*", "minio.*", "mf_storage.*"]
ignore_missing_imports = true


[tool.uv.sources]
mf-storage = { path = "../packages/mf-storage", editable = true }
