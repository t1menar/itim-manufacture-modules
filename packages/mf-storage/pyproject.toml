[project]
name = "mf-storage"
version = "0.1.0"
description = "Shared S3/MinIO helpers for Manufacture modules (s3:// refs + presigned GET)"
requires-python = ">=3.12"
dependencies = [
    "minio>=7.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mf_storage"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/mf_storage"]

[[tool.mypy.overrides]]
module = ["minio.*"]
ignore_missing_imports = true
