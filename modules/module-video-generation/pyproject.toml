[project]
name = "module-video-generation"
version = "0.1.0"
description = "Manufacture stage `video`: capture of the real session, render, sound, packaging of a finished post"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "jsonschema>=4.23",
    "mvrender[render]",
    "docker>=7",
    "manufacture-sdk",
    "mf-storage",
    "claude-agent-sdk>=0.2",
]

[tool.uv.sources]
mf-storage = { path = "../../packages/mf-storage", editable = true }
mvrender = { path = "../../packages/mvrender" }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "types-jsonschema>=4.23",
    "aiosqlite>=0.20",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-docker",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mvgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "tests"]
markers = ["docker: needs a Docker daemon and MVGEN_DOCKER_IMAGE (a digest-pinned image ref); skipped otherwise"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "ASYNC221", "ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
