# MinIO for local Manufacture artifact storage.
# Internal API: http://127.0.0.1:59000  (S3 API)
# Console:      http://127.0.0.1:59001
# Public endpoint for presigned URLs in local/dev defaults to the same host.
# In production set S3_PUBLIC_ENDPOINT to the TLS reverse-proxy host (e.g. media.example.com).
services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: manufacture
      MINIO_ROOT_PASSWORD: manufacture_dev_secret
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 manufacture manufacture_dev_secret; do sleep 1; done;
      mc mb --ignore-existing local/manufacture;
      mc anonymous set none local/manufacture;
      echo bucket_ready;
      "

volumes:
  minio_data:
