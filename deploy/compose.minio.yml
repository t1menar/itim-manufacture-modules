# Standalone MinIO (same image as compose.yml). Default ports 59000/59001 for mfinfra.
# Presigned URLs: for live Instagram, tunnel 59000 (cloudflared/ngrok) and set S3_PUBLIC_ENDPOINT.
services:
  minio:
    image: ${MINIO_IMAGE:-manufacture-minio:local}
    build:
      context: .
      dockerfile: Dockerfile.minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-manufacture}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-manufacture_dev_secret}
      S3_BUCKET: ${S3_BUCKET:-manufacture}
    ports:
      - "${MINIO_API_PORT:-59000}:9000"
      - "${MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  minio_data:
