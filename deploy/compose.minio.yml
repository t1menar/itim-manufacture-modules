# Local MinIO for Manufacture artifact storage (default: http://localhost).
# S3 API:  http://127.0.0.1:59000
# Console: http://127.0.0.1:59001
#
# Presigned URLs default to the same host. For live Instagram publish, temporarily
# tunnel port 59000 (cloudflared / ngrok) and set S3_PUBLIC_ENDPOINT to that host.
# No permanent domain or TLS reverse-proxy is required for local/dev.
services:
  minio:
    # Bitnami image is reliably pullable on Docker Hub for local compose.
    image: bitnami/minio:latest
    environment:
      MINIO_ROOT_USER: manufacture
      MINIO_ROOT_PASSWORD: manufacture_dev_secret
      MINIO_DEFAULT_BUCKETS: manufacture
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  minio_data:
